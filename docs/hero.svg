<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="style-study: learn the style, never the pattern">
<title>style-study: learn the style, never the pattern</title>
<rect x="1" y="1" width="1278" height="638" rx="22" fill="#F4F0E8" stroke="#DDD5C6" stroke-width="2"/>
<text x="64.0" y="136.0" font-family="Georgia, 'Times New Roman', serif" font-size="92" fill="#1F1D1A" letter-spacing="-1.5">style-study</text>
<text x="68" y="192" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-style="italic" fill="#1F1D1A">Learn the style. <tspan fill="#D9482B">Never the pattern.</tspan></text>
<text x="68.0" y="236.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#6E675D">Measure reference works, keep only what recurs, design something new, then prove it is not a copy.</text>
<text x="68.0" y="266.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#6E675D">Video  ·  images  ·  music and sound  ·  Thai and English writing  ·  any other medium, by hand</text>
<line x1="236" y1="316" x2="236" y2="596" stroke="#E4DDD0" stroke-width="2"/>
<text x="64.0" y="350.0" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1F1D1A" font-style="italic">the reference</text>
<text x="64.0" y="372.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6E675D">its order, its material</text>
<text x="64.0" y="458.0" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1F1D1A" font-style="italic">the card</text>
<text x="64.0" y="480.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6E675D">ranges only</text>
<text x="64.0" y="562.0" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1F1D1A" font-style="italic">your new work</text>
<text x="64.0" y="584.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6E675D">own order, own material</text>
<text x="64.0" y="408.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#2F6B4F">↓ measure, drop the order</text>
<text x="64.0" y="512.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#2F6B4F">↓ brief, then make</text>
