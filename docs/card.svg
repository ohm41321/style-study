<text x="700.0" y="596.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#1F1D1A" font-style="italic">Habits, each seen 3 times or more</text>
<text x="700.0" y="632.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#2F6B4F">camera</text>
<text x="810.0" y="632.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1F1D1A">The camera slides sideways at walking pace and never</text>
<text x="810.0" y="654.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1F1D1A">zooms or pushes in.</text>
<text x="700.0" y="690.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#2F6B4F">framing</text>
<text x="810.0" y="690.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1F1D1A">Subjects sit low in the frame with a band of sky or</text>
<text x="810.0" y="712.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1F1D1A">wall above them.</text>
<text x="700.0" y="748.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#2F6B4F">type</text>
<text x="810.0" y="748.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1F1D1A">On-screen words are a thin serif, small, and fade up</text>
<text x="810.0" y="770.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1F1D1A">over a few frames.</text>
<text x="700.0" y="806.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#2F6B4F">sound</text>
<text x="810.0" y="806.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1F1D1A">Room tone and a single sustained instrument carry</text>
<text x="810.0" y="828.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1F1D1A">the sound; hits are rare and soft.</text>
<text x="64.0" y="810.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#D9482B" font-style="italic">Never</text>
<text x="64.0" y="840.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1F1D1A">No whip pans, speed ramps or lens flares.</text>
<text x="64.0" y="862.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1F1D1A">No saturated accent colours; nothing neon.</text>
<text x="64.0" y="902.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#D9482B" font-style="italic">Forbid</text>
