<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 790" width="1280" height="790" role="img" aria-label="The firewall between the checker and the maker">
<title>The firewall between the checker and the maker</title>
<rect x="1" y="1" width="1278" height="788" rx="22" fill="#F4F0E8" stroke="#DDD5C6" stroke-width="2"/>
<text x="64.0" y="92.0" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#1F1D1A">The firewall</text>
<text x="66.0" y="130.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#6E675D">Two desks. Only the card and the brief reach the maker. Only the new work comes back.</text>
<rect x="64" y="170" width="520" height="578" rx="18" fill="#ECE6DA"/>
<text x="88.0" y="208.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#1F1D1A" font-style="italic">the checker's desk</text>
<text x="88.0" y="726.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#6E675D" font-style="italic">Never handed to the maker.</text>
<rect x="696" y="170" width="520" height="578" rx="18" fill="#ECE6DA"/>
<text x="720.0" y="208.0" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#1F1D1A" font-style="italic">the maker's desk</text>
<text x="720.0" y="726.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#6E675D" font-style="italic">Never sees the references.</text>
